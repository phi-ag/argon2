name: e2e

runs:
  using: composite
  steps:
    - name: End-to-End
      uses: phi-ag/run-playwright@5a83095c61d9461619391a8ee56fc1959acad29c # v1
      with:
        version: v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
        options: -v ${STORE_PATH}:${STORE_PATH}
        run: |
          npm install -g --force corepack@0.36.0

          pnpm config set store-dir ${STORE_PATH}
          pnpm install --frozen-lockfile
          pnpm test:e2e
